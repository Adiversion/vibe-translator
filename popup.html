<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Translator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            width: 320px;
            background: #0f1115;
            color: #f1f3f5;
            padding: 18px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #23272f;
        }
        .logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(255, 69, 0, 0.25);
        }
        .title-group h1 {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }
        .title-group p {
            font-size: 11px;
            color: #949ca8;
            margin-top: 2px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(36, 160, 237, 0.15);
            color: #24a0ed;
            padding: 2px 7px;
            border-radius: 9999px;
            margin-top: 4px;
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00d2ff;
        }
        .section-label {
            font-size: 12px;
            font-weight: 600;
            color: #ced4da;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .input-group {
            margin-bottom: 12px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            background: #181b20;
            border: 1px solid #2b303c;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            color: #f8f9fa;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #ff4500;
        }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff4500, #ff6b35);
            color: #ffffff;
        }
        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #23272f;
            color: #ced4da;
        }
        .btn-secondary:hover {
            background: #2c323c;
            color: #ffffff;
        }
        .status-msg {
            font-size: 11px;
            margin-top: 10px;
            text-align: center;
            min-height: 16px;
            transition: opacity 0.2s;
        }
        .status-success {
            color: #4cd964;
        }
        .status-info {
            color: #a0aab8;
        }
        .footer {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #23272f;
            font-size: 10px;
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icons/icon48.png" alt="Vibe Translator Logo" class="logo">
        <div class="title-group">
            <h1>Vibe Translator</h1>
            <p>Authentic Hinglish for Reddit</p>
            <div class="badge">
                <span class="badge-dot"></span>
                <span>Active on reddit.com</span>
            </div>
        </div>
    </div>

    <div class="section-label">
        <span>Gemini API Key</span>
        <span style="font-size: 10px; color: #868e96;">Optional</span>
    </div>

    <div class="input-group">
        <input type="password" id="api-key-input" placeholder="Built-in testing key active" autocomplete="off">
    </div>

    <div class="btn-row">
        <button id="save-btn" class="btn-primary">Save Key</button>
        <button id="reset-btn" class="btn-secondary">Reset to Default</button>
    </div>

    <div id="status-msg" class="status-msg status-info">Built-in local testing key is enabled.</div>

    <div class="footer">
        Gemini 3.5 Flash Lite • Natural Slang & Emotion
    </div>

    <script src="popup.js"></script>
</body>
</html>
